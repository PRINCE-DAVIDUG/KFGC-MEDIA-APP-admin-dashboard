<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6fa;
  color: #222;
}

.header {
  background: #0A1A44;
  color: white;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header h2 {
  margin: 0;
  font-size: 20px;

.back-btn {

  font-weight: bold;
}

.container {
  max-width: 1150px;
  margin: 30px auto;
  padding: 15px;
}

.page-title {
  color: #08203a;
  margin-bottom: 8px;
}

.subtitle {
  color: #666;
  margin-bottom: 25px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 18px;
}

.stat-card {
  background: white;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
  border-left: 4px solid #d9a441;
}

.stat-card i {
  font-size: 27px;
  color: #d9a441;
}

.stat-card h3 {
  color: #08203a;
  margin: 15px 0 5px;
}

.stat-card p {
  color: #777;
  margin: 0;
}

.directory {
  background: white;
  margin-top: 30px;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.directory h2 {
  color: #08203a;
}

.search-box {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 8px;
  margin: 15px 0;
  font-size: 15px;
}

.empty-state {
  text-align: center;
  padding: 45px 15px;
  color: #777;
}

.empty-state i {
  font-size: 45px;
  color: #d9a441;
  margin-bottom: 15px;
}

.empty-state h3 {
  color: #08203a;
}

.badge {
  display: inline-block;
  background: #fff4d9;
  color: #8a6417;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

footer {
  background: #0A1A44;
  color: white;
  text-align: center;
  padding: 20px;
  margin-top: 50px;
}

@media(max-width: 500px) {
  .header h2 {
    font-size: 16px;
  }

  .container {
    margin-top: 15px;
  }
}
</style>
</head>

</header>
